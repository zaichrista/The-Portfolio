    <text transform="translate(233.148 389.383)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Creative direction</tspan><tspan x="0" y="24">Branding</tspan><tspan x="0" y="48">Graphic design</tspan><tspan x="0" y="72">Cultural research</tspan></text>
    <text transform="translate(233.149 555.733)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Creative project drawing on cultural </tspan><tspan x="0" y="24">references and place to construct a </tspan><tspan x="0" y="48">contemporary visual identity. Development </tspan><tspan x="0" y="72">of the concept, brand language and art </tspan><tspan x="0" y="96">direction, translating research into a </tspan><tspan x="0" y="120">cohesive visual world.</tspan></text>
