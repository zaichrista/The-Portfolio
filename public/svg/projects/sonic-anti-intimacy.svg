    <text transform="translate(237.237 323.117)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Cultural research</tspan><tspan x="0" y="24">Music research</tspan><tspan x="0" y="48">Critical theory</tspan><tspan x="0" y="72">Writing</tspan></text>
    <text transform="translate(237.237 489.468)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Research project investigating how sound, </tspan><tspan x="0" y="24">technology and contemporary listening </tspan><tspan x="0" y="48">practices can create distance rather than </tspan><tspan x="0" y="72">intimacy. Development of a critical </tspan><tspan x="0" y="96">framework combining music, digital culture </tspan><tspan x="0" y="120">and theories of mediated connection.</tspan></text>
