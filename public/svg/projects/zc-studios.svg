    <text transform="translate(231.643 375.813)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Brand strategy</tspan><tspan x="0" y="24">Creative direction</tspan><tspan x="0" y="48">Design</tspan><tspan x="0" y="72">Cultural research</tspan></text>
    <text transform="translate(231.643 542.163)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Creative practice spanning fashion, </tspan><tspan x="0" y="24">branding and cultural strategy. </tspan><tspan x="0" y="48">Development of research-led identities, </tspan><tspan x="0" y="72">concepts and visual systems designed to </tspan><tspan x="0" y="96">connect cultural insight with strong, </tspan><tspan x="0" y="120">recognisable creative worlds.</tspan></text>
