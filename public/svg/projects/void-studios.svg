  <text transform="translate(242.456 323.117)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Creative direction</tspan><tspan x="0" y="24">Brand strategy</tspan><tspan x="0" y="48">Graphic design</tspan><tspan x="0" y="72">Art direction</tspan></text>
  <text transform="translate(242.456 489.468)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Independent creative studio exploring </tspan><tspan x="0" y="24">fashion, culture and visual identity. </tspan><tspan x="0" y="48">Conception of the brand world, visual </tspan><tspan x="0" y="72">language and creative direction, with a </tspan><tspan x="0" y="96">focus on building distinctive identities </tspan><tspan x="0" y="120">through research-led strategy, </tspan><tspan x="0" y="144">image-making and design.</tspan></text>
