    <text transform="translate(237.237 323.117)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Creative direction</tspan><tspan x="0" y="24">Fashion production</tspan><tspan x="0" y="48">Branding</tspan><tspan x="0" y="72">Event strategy</tspan></text>
    <text transform="translate(237.237 489.468)" font-family="TimesNewRomanPSMT, &apos;Times New Roman&apos;" font-size="20"><tspan x="0" y="0">Student-led fashion event bringing together </tspan><tspan x="0" y="24">designers, performers and creative </tspan><tspan x="0" y="48">communities in Oxford. Development of </tspan><tspan x="0" y="72">the event identity, creative direction and </tspan><tspan x="0" y="96">visual communication alongside the </tspan><tspan x="0" y="120">coordination and presentation of the final </tspan><tspan x="0" y="144">fashion showcase.</tspan></text>
