<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaira Christa</title>
  <meta name="description" content="Zaira Christa: creative strategist working across culture, fashion, and hospitality.">
  <!-- Tinos is metric-identical to Times New Roman: a fallback for devices without it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Apply the saved day/night theme before anything draws (no flash).
    try { if (localStorage.getItem('theme') === 'night') document.documentElement.dataset.mode = 'night'; } catch (e) {}
    // The loader plays once per visit, not on every refresh.
    try { if (sessionStorage.getItem('loaded')) document.documentElement.dataset.loader = 'skip'; } catch (e) {}
  </script>
</head>
<!--
  data-fit="stretch"  → the design stretches to fill any window (default)
  data-fit="contain"  → the design keeps its 1280×1024 proportions, centred
-->
<body data-fit="stretch">
  <div id="loader" class="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="1">
    <span class="loader__count">001%</span>
  </div>

  <div id="stage" class="stage"></div>

  <!-- Day / night toggle: sun by day, moon by night -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to night mode" aria-pressed="false">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <g class="theme-toggle__sun">
        <circle cx="16" cy="16" r="5.5"/>
        <line x1="16" y1="2"  x2="16" y2="6.5"/>
        <line x1="16" y1="25.5" x2="16" y2="30"/>
        <line x1="2"  y1="16" x2="6.5" y2="16"/>
        <line x1="25.5" y1="16" x2="30" y2="16"/>
        <line x1="6.1"  y1="6.1"  x2="9.3"  y2="9.3"/>
        <line x1="22.7" y1="22.7" x2="25.9" y2="25.9"/>
        <line x1="6.1"  y1="25.9" x2="9.3"  y2="22.7"/>
        <line x1="22.7" y1="9.3"  x2="25.9" y2="6.1"/>
      </g>
      <path class="theme-toggle__moon" d="M20.5 4.5a11.5 11.5 0 1 0 7 17.2A10 10 0 0 1 20.5 4.5z"/>
    </svg>
  </button>
  <script src="/js/app.js"></script>
</body>
</html>
